  sflow-capability-map: { class: interactive, executionBoundary: organisation }
  sflow-code: { class: generative, maximumTokenOverride: 1290, exception: 'Code-phase recovery and publication-time test diagnosis must preserve safe current-phase repair without bypassing evidence, generated public code must carry doc comments, the code author must produce its planned evidence files, and a question that arises while coding must reach the person or the earlier step that owns it without stopping the code. Its JSON reads carry --for-agent, so a long result arrives bounded with act first, not in a file the agent cannot open. It keeps the guard and anti-stall sentences a 2026-10-19 budget trim had removed; never trim those to fit. It runs its entry once in every turn, also after an interrupted one, so an earlier turn''s staging path is never reused (2026-10-21, staging permissions).' }
  sflow-document-intake: { class: generative, maximumTokenOverride: 806, exception: "It ends with `phase prepublish --publish-if-ready`, which publishes and returns the review in the same command instead of three Copilot round trips, so it names when not to run `commands.publish` itself. It keeps the guard and anti-stall sentences a 2026-10-19 budget trim had removed; never trim those to fit. It runs its entry once in every turn, also after an interrupted one, so an earlier turn's staging path is never reused (2026-10-21, staging permissions)." }
  sflow-scenario-check: { class: generative, maximumTokenOverride: 856, exception: "It ends with `phase prepublish --publish-if-ready`, which publishes and returns the review in the same command instead of three Copilot round trips, so it names when not to run `commands.publish` itself. It keeps the guard and anti-stall sentences a 2026-10-19 budget trim had removed; never trim those to fit. It runs its entry once in every turn, also after an interrupted one, so an earlier turn's staging path is never reused (2026-10-21, staging permissions)." }
