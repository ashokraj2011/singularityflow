  sflow-agents: { class: echo, executionBoundary: repository }
  sflow-admin: { class: conversational, executionBoundary: machine }
  sflow-apm: { class: echo, executionBoundary: repository }
  sflow-approvals: { class: echo, executionBoundary: repository }
  sflow-approve: { class: review, maximumTokenOverride: 990, exception: "It keeps the guard and anti-stall sentences a 2026-10-19 budget trim had removed; never trim those to fit. When pending decisions hold the approval it opens the decision list in the same turn (/sf-decide steps 11-14) instead of printing raw decision commands (2026-10-19, decision list). It shows `blockingCommits`, the commits approval would refuse for with any pending intent amendment, and continues the review rather than stopping (2026-10-24, approval history). A checklist phase asks for one answer per article with the confirmation and passes them as --article, so Copilot can approve it (2026-10-24, SPEC-OAP D8). It also shows `approvalCheck`, the approval gate's own preview, and continues (SPEC-OAP M1). Arriving from /sf-decide, it adds that skill's decision flags to the approve command, so the decisions land in the approval's one commit (SPEC-OAP M4). Since 2026-10-29 step 4 relays act.do when nobody is listed in the approval group (an approver refresh): one clause, no exit." }
