# Optional example. Adapt registry authentication and package version for your organization.
name: Singularity Flow lifecycle validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Define this repository variable as the approved Artifactory npm virtual repository.
      # When omitted, npm uses the runner's configured registry.
      NPM_CONFIG_REGISTRY: ${{ vars.SINGULARITY_FLOW_NPM_REGISTRY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install approved Singularity Flow version
        run: npm install --global singularity-flow@0.9.0
      - name: Run deterministic governance gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SINGULARITY_FLOW_ENFORCE_TERMINAL: ${{ github.event.pull_request.draft == false && '1' || '0' }}
        run: singularity-flow gate
