  <title id="title">Singularity Flow</title>
  <desc id="desc">The Singularity Flow app icon: an integral f between S and F, from 0 to infinity, inside flowing braces.</desc>

  <!--
    Source of icon.png, the extension icon (VS Code accepts only a PNG there): render this file at
    256 x 256 with a transparent background. Coordinates are the brand sheet's pixels, so the
    drawing can be overlaid on the sheet.
  -->
