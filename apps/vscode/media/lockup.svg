      <stop offset="0" stop-color="#1f6e48"/>
      <stop offset="0.5" stop-color="#3f9462"/>
      <stop offset="1" stop-color="#72b98a"/>
    </linearGradient>
  </defs>
  <rect width="339" height="191" rx="10" fill="#252c37"/>
  <g transform="translate(48 50) scale(.4423) translate(-83 -86)"
     stroke="url(#ink)" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="9"
