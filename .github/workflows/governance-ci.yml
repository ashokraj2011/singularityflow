name: Governance CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: governance-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  full-suite:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20, suite: full, label: 'npm test (ubuntu-latest, Node 20)' }
          - { os: ubuntu-latest, node: 22, suite: full, label: 'npm test (ubuntu-latest, Node 22)' }
          - { os: ubuntu-latest, node: 26, suite: full, label: 'npm test (ubuntu-latest, Node 26)' }
          - { os: macos-latest, node: 22, suite: full, label: 'npm test (macos-latest, Node 22)' }
          - { os: windows-latest, node: 22, suite: platform, label: 'platform assurance (windows-latest, Node 22)' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Configure deterministic Git test identity
        run: |
          git config --global user.name "Singularity Flow CI"
          git config --global user.email "singularity-flow-ci@example.invalid"
      - run: npm ci
      - run: npm run vscode:build
      - name: Run full test suite
        if: matrix.suite == 'full'
        run: npm test
      # The product currently installs on Windows through Git Bash, while most repository and
      # installer scenarios exercise POSIX-only shell contracts. Keep the Windows gate focused on
      # the cross-platform code-generation assurance, process, path, encoding, and vocabulary APIs.
      - name: Run Windows platform assurance suite
        if: matrix.suite == 'platform'
        run: npm run test:platform:windows

  provenance:
    name: attest release artifacts
    if: github.event_name == 'push'
    needs: [check, full-suite]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build release artifacts
        run: |
          npm pack
          npm run vscode:build
          npm run vscode:package
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ github.workspace }}/*.tgz
            ${{ github.workspace }}/apps/vscode/*.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singularity-flow-${{ github.sha }}
          if-no-files-found: error
          path: |
            *.tgz
            apps/vscode/*.vsix
