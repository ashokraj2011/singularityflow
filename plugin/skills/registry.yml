version: 1

# Only these skills may be selected automatically from natural-language requests.
# Every other skill remains user-invocable through its /sflow-* command.
automaticInvocationAllowlist:
  - sflow-help
  - sflow-nextsteps
  - sflow-status

classes:
  conversational:
    outputContract: guided-actions
    warningTokens: 500
    maximumTokens: 800
  echo:
    outputContract: concise-relay
    warningTokens: 500
    maximumTokens: 800
  interactive:
    outputContract: explicit-selection
    warningTokens: 500
    maximumTokens: 800
  review:
    outputContract: governed-review
    warningTokens: 500
    maximumTokens: 800
  generative:
    outputContract: clarification-and-artifact
    warningTokens: 500
    maximumTokens: 800
  mutation:
    outputContract: deterministic-mutation
    warningTokens: 500
    maximumTokens: 800

# Every public skill is deliberately classified. All classes share the same body
# budget so catalog growth cannot hide behind per-skill exceptions.
skills:
  sflow-about: { class: echo }
  sflow-agent: { class: interactive }
  sflow-agents: { class: echo }
  sflow-approve: { class: review }
  sflow-capabilities: { class: echo }
  sflow-capability-doctor: { class: echo }
