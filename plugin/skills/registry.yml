    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  generative:
    outputContract: clarification-and-artifact
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  mutation:
    outputContract: deterministic-mutation
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  repair:
    outputContract: scoped-repair
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  advisory:
