<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFlow Workspace</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/code-explainer.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="navigation-scrim" hidden></div>
  <aside id="sidebar">
    <a class="brand" href="#home" aria-label="SFlow overview">
      <img class="brand-mark" src="/sflow-brand.svg" width="36" height="36" alt="">
      <span class="brand-name nav-label">Singularity Flow</span>
    </a>
    <nav id="navigation" aria-label="Main navigation"></nav>
    <div class="sidebar-bottom">
      <a class="nav-link" href="#about" title="About" aria-label="About"><span id="about-icon"></span><span class="nav-label">About</span></a>
      <button id="collapse" class="nav-link" type="button" title="Collapse navigation" aria-label="Collapse navigation" aria-controls="navigation">
        <span id="collapse-icon"></span><span class="nav-label">Collapse sidebar</span>
      </button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumbs">
        <button id="mobile-menu" class="icon-button" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
        <button id="context-switch" class="quiet" type="button" aria-label="Switch checkout" aria-haspopup="dialog" disabled>
          <span id="checkout-icon"></span><span id="context-name">Workspace</span><span id="checkout-chevron"></span>
        </button>
        <span class="breadcrumb-divider" aria-hidden="true">/</span>
        <span id="current-page">Overview</span>
      </div>
      <button id="quick-ask" type="button" aria-label="Search or ask SFlow" aria-keyshortcuts="Meta+K Control+K" disabled>
        <span id="quick-ask-icon"></span><span class="quick-ask-label">Search or ask…</span><kbd id="quick-ask-key">Ctrl K</kbd>
      </button>
      <div class="topbar-actions">
        <span id="connection" class="connection" role="status" data-status="connecting"><i></i><span id="connection-text">Connecting</span></span>
        <button id="activity-toggle" class="quiet" type="button" aria-expanded="false" aria-controls="activity">
          <span id="activity-icon"></span><span>Activity</span><span id="activity-count" hidden>0</span>
        </button>
      </div>
    </header>
    <div id="banner" hidden><span id="banner-message" role="status"></span>
      <button id="banner-close" class="icon-button" type="button" aria-label="Dismiss message"></button>
    </div>
    <main id="main" tabindex="-1">
      <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Connecting to SFlow…</div>
    </main>
  </div>
  <aside id="activity" hidden aria-label="Workspace activity">
    <header class="activity-heading"><h2>Activity</h2><button id="activity-close" class="icon-button" type="button" aria-label="Close activity"></button></header>
    <div id="activity-items"></div>
  </aside>
  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form">
      <h2 id="create-title">New specification</h2>
      <label for="spec-title">Name</label>
      <input id="spec-title" required maxlength="240" placeholder="Simpler checkout">
      <label for="spec-kind">Specification type</label>
      <select id="spec-kind"><option value="business">Business need</option><option value="technical">Technical solution</option></select>
      <label for="spec-idea">Your starting idea <span class="muted">(optional)</span></label>
      <textarea id="spec-idea" rows="4" maxlength="20000" placeholder="Who is it for, and what should improve?"></textarea>
      <div id="create-error" class="form-error" role="alert"></div>
      <div class="dialog-actions">
        <button type="button" id="create-cancel" class="quiet">Cancel</button>
        <button type="submit" class="primary">Create specification</button>
      </div>
    </form>
  </dialog>
  <dialog id="context-dialog" aria-labelledby="context-title">
    <h2 id="context-title">Switch checkout</h2>
    <p class="muted">Choose a checkout already opened in this tab, or find another one in Stories.</p>
    <button id="context-follow" type="button">Follow active Story</button>
    <div id="context-choices"></div>
    <div id="context-error" class="form-error" role="alert"></div>
    <div class="dialog-actions">
      <button id="context-cancel" class="quiet" type="button">Close</button>
      <a id="context-stories" class="button" href="#stories">Browse Stories</a>
    </div>
  </dialog>
</body>
</html>
