<svg xmlns="http://www.w3.org/2000/svg"
     width="24"
     height="24"
     viewBox="-4 -4 32 32"
     fill="none"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Singularity Flow</title>
  <desc id="desc">The Singularity Flow mark: an f with infinity above it and zero below it.</desc>

  <!--
    The @sflow chat participant's avatar in dark and high-contrast dark themes; chat-light.svg is
    the other half of the pair.
    VS Code shows a participant icon as an <img>, where currentColor resolves to black, so this copy
    of media/activity.svg carries a fixed ink instead: the banner's light green.
    The paths are activity.svg's; only the viewBox differs. VS Code crops the avatar to a circle,
    and the mark reaches 14.25 units from the centre of its 24-unit grid, so the box is padded to
    32 units around that centre to keep the ∞ and the 0 inside the crop.
  -->
  <g stroke="#72b98a" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="1.6"
          d="M13.2 4.7C13 3.35 12.5 2.6 11.85 2.6C11.1 2.6 10.75 3.4 10.65 4.4L9.7 17.6C9.55 19.75 8.85 21.1 7.9 21.1C7.75 21.1 7.62 21.07 7.5 21.02M8.3 10.6H12.1"/>
    <path stroke-width="1.4"
          d="M18.85 3.45C18.33 2.62 17.81 1.85 17.17 1.85C16.42 1.85 15.9 2.55 15.9 3.45S16.42 5.05 17.17 5.05C17.81 5.05 18.33 4.28 18.85 3.45S19.89 1.85 20.53 1.85C21.28 1.85 21.8 2.55 21.8 3.45S21.28 5.05 20.53 5.05C19.89 5.05 19.37 4.28 18.85 3.45Z"/>
    <ellipse stroke-width="1.4" cx="3.55" cy="19" rx="1.55" ry="2.45"/>
  </g>
</svg>
