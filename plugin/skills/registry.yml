  sflow-approvals: { class: echo, executionBoundary: repository }
  sflow-approve: { class: review, maximumTokenOverride: 870, exception: "It keeps the guard and anti-stall sentences a 2026-10-19 budget trim had removed; never trim those to fit. When pending decisions hold the approval it opens the decision list in the same turn (/sf-decide steps 11-14) instead of printing raw decision commands (2026-10-19, decision list)." }
  sflow-assign: { class: mutation }
  sflow-auto: { class: interactive, kernelModelPolicy: conditional, executionBoundary: repository }
