version: 1

# Only these skills may be selected automatically from natural-language requests.
# Every other skill remains user-invocable through its /sflow-* command.
#
# The bar for this list is not "useful" — it is "cannot change governed state". A newcomer should be
# able to ask what is going on and be answered, without having to recall one of 97 exact slash names;
# they should never be able to cause an approval or a publication by phrasing a question a particular
# way. So every entry here reads: status, progress, the inbox, diagnostics, logs, help, served
# documentation, and the
# sandboxed walkthrough. Nothing that submits, approves, publishes, merges, or writes to the ledger
# belongs here, however convenient it would be.
#
# sflow-inbox is deliberately NOT here despite being the obvious candidate. It does not merely list
# pending approvals: it asks the reviewer a question and attaches a session to open a review. That is
# a step into a decision, and a decision is precisely what a phrasing of a question must not start.
# "What is waiting on me?" is answered well enough by status and nextsteps.
automaticInvocationAllowlist:
  - sflow-advise
  - sflow-docs
  - sflow-doctor
  - sflow-help
  - sflow-home
  - sflow-logs
  - sflow-nextsteps
  - sflow-progress
  - sflow-quickstart
  - sflow-receipt
  - sflow-recommend
  - sflow-status

classes:
  conversational:
    outputContract: guided-actions
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  echo:
    outputContract: concise-relay
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 8192
    hardMaximumBytes: 65536
  interactive:
    outputContract: explicit-selection
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  guided:
    outputContract: conversational-guidance
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  review:
    outputContract: governed-review
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  generative:
    outputContract: clarification-and-artifact
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  mutation:
    outputContract: deterministic-mutation
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536

# Every public skill is deliberately classified. All classes share the same body
# budget so catalog growth cannot hide behind per-skill exceptions. A skill defaults
# to the active Story boundary. Entry points that can run before Story selection must declare the
# narrowest honest boundary: machine for installed-product and workspace-registry operations,
# repository for one explicitly opened/selected checkout, or organisation for a selected lead
# authority. A broader boundary may narrow through verified CLI output, but may never discover a
# repository by searching a home or parent directory.
skills:
  sflow-about: { class: echo, executionBoundary: machine }
  sflow-adhoc: { class: interactive, executionBoundary: repository }
