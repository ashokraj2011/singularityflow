  # POC Lite is the first proof, not a second lifecycle engine. All four checkpoints use the
  # ordinary phase machinery, deterministic artifacts, the repository's own executable tests,
  # and one final human decision. It has no MCP, external tracker, model, or World Model dependency.
  poc-lite-plan:
    label: PLAN — bound the local change
    defaultTemplate: poc-lite/plan.md
    artifact:
      path: artifacts/poc-lite-plan/plan.md
      kind: delivery-plan
      minimumBytes: 200
      validation: { requiredHeadings: [Work item, Changed paths, Configured checks, Specification claims] }
    generation: { requirement: required, producer: deterministic, task: reason }
    worldModel: { views: [] }
    writeScope: artifact-only
    approval: none
  poc-lite-act:
    label: ACT — make the bounded change
    defaultTemplate: poc-lite/act.md
    artifact:
      path: artifacts/poc-lite-act/implementation-summary.md
      kind: implementation-summary
      minimumBytes: 200
      validation: { requiredHeadings: [Work item, Changed paths, Configured checks, Specification claims] }
    generation: { requirement: required, producer: deterministic, task: code }
    worldModel: { views: [] }
    writeScope: source-and-artifact
    approval: none
    # Code-delivery publication adds the repository-native executable test command inferred from
    # the changed module. This deterministic whitespace check is additive, not a substitute.
    qualityCommands:
      - { id: git-diff-check, argv: [git, diff, --check], modelPolicy: never }
  poc-lite-verify:
    label: VERIFY — run repository checks
    defaultTemplate: poc-lite/verify.md
    artifact:
      path: artifacts/poc-lite-verify/verification.md
      kind: test-evidence
      minimumBytes: 200
      validation: { requiredHeadings: [Work item, Changed paths, Configured checks, Specification claims] }
    generation: { requirement: required, producer: deterministic, task: analyze }
    worldModel: { views: [] }
    writeScope: artifact-only
    approval: none
    qualityCommands:
      - { id: git-diff-check, argv: [git, diff, --check], modelPolicy: never }
  poc-lite-finalize:
    label: FINALIZE — human finish decision
    defaultTemplate: poc-lite/finalize.md
    artifact:
      path: artifacts/poc-lite-finalize/finalize.md
      kind: publication-review
      minimumBytes: 200
      validation: { requiredHeadings: [Work item, Changed paths, Configured checks, Specification claims] }
    generation: { requirement: required, producer: deterministic, task: summarize }
    worldModel: { views: [] }
    writeScope: artifact-only
    approval: { authorities: [quality-reviewers], requiredAuthorities: [quality-reviewers], minimum: 1, rejectTo: [poc-lite-plan, poc-lite-act, poc-lite-verify, poc-lite-finalize] }

  # ---------------------------------------------------------------------------------------------
  # Spec-driven phases. Ordinary phases in every respect: they use the same generation, input,
  # approval, world-model, sequence-gate, evidence and publication machinery as every other phase,
  # with no profile-specific engine branch [SPK:CON-020]. The constitution is pinned configuration
  # rather than a phase [SPK:CON-018], and the task map is an advisory planning member rather than a
  # phase [SPK:CON-019].
  specification:
    label: Specification
    defaultTemplate: spec-driven/spec.md
    artifact: { path: artifacts/specification/spec.md, kind: requirements, minimumBytes: 400 }
    artifactSet: spec-driven-specification
    worldModel: {views: [biz.rules], depth: standard}
    clarification:
      mode: required
      maxQuestions: 5
      topics: [scope, acceptance criteria, actors, boundary conditions, non-functional requirements]
      # Pinned separately from the conversational mode above [SPK:REQ-064]. Under `block` an
      # unresolved [NEEDS CLARIFICATION: ...] stops publication before any state mutation, so an
      # honest admission costs only the answer [SPK:REQ-065].
      markers: { mode: block }
    # The starter specification phase enforces [SPK:REQ-051].
    specificationQuality:
      mode: enforce
      checklist: requirements-quality-v1
      # Keep deterministic quality findings, but do not require the six legacy human checklist
      # decisions at Specification approval. Existing Stories retain their pinned policy.
      approvalChecklist: off
    writeScope: artifact-only
    approval: { authorities: [product-approvers], minimum: 1, rejectTo: [specification] }
  planning:
    label: Planning
    defaultTemplate: spec-driven/plan.md
    artifact: { path: artifacts/planning/plan.md, kind: design, minimumBytes: 300 }
    artifactSet: spec-driven-planning
    worldModel: {views: [arch.contracts], depth: standard}
    # Planning consumes the approved specification without a second mandatory interview. Material
    # intent changes return through governed amendment/rework rather than an ad-hoc response file.
    clarification: { mode: off }
    writeScope: artifact-only
    approval: { authorities: [architecture-reviewers], minimum: 1, rejectTo: [specification, planning] }
  release:
    label: Release
    defaultTemplate: spec-driven/release.md
    artifact: { path: artifacts/release/conformance.md, kind: conformance-report, minimumBytes: 300 }
    artifactSet: spec-driven-verification
    worldModel: {views: [arch.contracts, dev.impact], depth: quick, evidence: true}
    writeScope: artifact-only
    approval: { authorities: [quality-reviewers], minimum: 1, rejectTo: [implementation, verification, release] }
  convergence:
    label: Convergence
    defaultTemplate: spec-driven/convergence.md
    # The convergence-report kind is what makes a step convergence, whatever it is called: the
    # engine generates it, and only explicit human advancement and approval pass it [E2G-001].
    artifact: { path: artifacts/convergence/convergence.md, kind: convergence-report, minimumBytes: 200 }
    generation: { requirement: required, producer: deterministic, task: analyze }
    worldModel: {views: [dev.impact], depth: quick}
    writeScope: artifact-only
    # Human advancement out of convergence, and governed rework back to implementation
    # [SPK:REQ-032]. Advancement fails while blocking findings remain [SPK:REQ-183].
    approval: { authorities: [architecture-reviewers], minimum: 1, rejectTo: [implementation] }
  implement:
    label: Implement
    defaultTemplate: quick-fix/implement.md
    artifact: { path: artifacts/implement/implementation-summary.md, kind: implementation-summary, minimumBytes: 200 }
    generation: { requirement: required, producer: deterministic, task: code }
    worldModel: {views: [dev.impact], depth: quick}
    writeScope: source-and-artifact
    approval: none
    qualityCommands: []
  verify:
    label: Verify
    defaultTemplate: quick-fix/verify.md
    artifact: { path: artifacts/verify/verification-summary.md, kind: test-evidence, minimumBytes: 200 }
    generation: { requirement: required, producer: deterministic, task: analyze }
    worldModel: {views: [dev.impact], depth: quick, evidence: true}
    writeScope: source-and-artifact
    approval: { mode: policy, policy: quick-fix-low-risk-v1, maximumChangedPaths: 5, authorities: [quality-reviewers], minimum: 1, rejectTo: [implement, verify] }
    # A policy waiver is impossible without at least one required check. Repositories
    # should replace or extend this deterministic baseline with their own test command.
    qualityCommands:
      - id: git-diff-check
        argv: [git, diff, --check]
        modelPolicy: never
governance:
  requireAcceptanceCriteriaTags: true
  protectedPaths:
    - singularity/workflow.yml
    - singularity/impact.yml
    - singularity/agent-mappings.yml
    - singularity/agents.lock.yml
    - singularity/templates
    - singularity/agents
    - singularity/prompts
    - .github/agents
    - plugin/agents
    - plugin/skills
    - .github/skills
