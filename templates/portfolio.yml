version: 1
initiativeRoot: singularity/initiatives
templatesRoot: singularity/templates

contextPolicy:
  onApproval: new
  onRejection: keep
  phaseOverrides: {}

git:
  remote: origin
  publish: required

# Identity is pinned independently for every Epic. Omit authority to use Jira
# when Jira is enabled and local Git-native IDs otherwise. Set it explicitly
# when an organization requires one authority for every new Epic.
identity:
  local:
    epicPrefix: SF-E
    storyPrefix: SF-S
    pad: 3
    # Story IDs include the reserved Epic sequence (SF-S-001-001). This keeps
    # independently planned Epics collision-free without a central service.
    scopeStoriesByEpic: true

# Jira policy is repository configuration; credentials are never repository
# data. VS Code stores them in SecretStorage backed by the operating-system
# credential store; headless CLI users supply approved environment variables.
# CLI users may continue to use JIRA_BASE_URL/JIRA_EMAIL/JIRA_API_TOKEN, or
# JIRA_BASE_URL/JIRA_PAT for Data Center.
jira:
  # Pin the Epic's own attachments as governed sources at start. A listed attachment is not
  # evidence until it has been fetched and hash-pinned; set false to pin them by hand instead.
  pinAttachments: true
  enabled: false
  connection: corporate-jira
  deployment: cloud
  allowedHosts: []
  allowedProjects: []
  authentication:
    permitted: [user-token, service-account]
    tokenExpiryWarningDays: 14
  read:
    epics: true
    stories: true
    attachmentPolicy: metadata-only
    cacheMinutes: 10
  writeMode: off
  writeOperations: [create-epic, create-story, create-subtask, update-owned-fields, add-comment, attach-artifact, set-lineage-property]
  allowedFields: [summary, description, parent, labels, components]
  # Backward-compatible materialization switch. New Jira writes additionally
  # require writeMode: approved and an exact reviewed write-plan hash.
  write: false
  projectKey: ""
  epicIssueType: Epic
  storyIssueType: Story
  subtaskIssueType: Sub-task

# Initiative approvals are authorized by normalized local Git email. Populate
# these groups before starting an initiative. Agents remain prompt behavior
# and never grant initiative approval authority.
# Conditional checklist items ask one of these questions of the initiative. Until an initiative
# answers, the item is reported `unanswered` and its gate still applies, so a control that might be
# required is never silently skipped. Answer with:
#   singularity-flow initiative applicability set <policy> yes|no --reason "..."
applicabilityPolicies:
  ux-required:
    label: UX design required
    question: Does this initiative change a user-facing experience that needs UX design?
  ai-use-case:
    label: AI use case
    question: Does this initiative introduce or change an AI/ML capability?
  security-review-required:
    label: Security review required
    question: Does this initiative change authentication, authorization, secret handling, or regulated data?
  domain-review-required:
    label: Domain architecture review required
    question: Does this initiative change a shared domain model or cross-domain contract?

approvalAuthorities:
  initiative-owners: { members: [] }
  executive-approvers: { members: [] }
  product-approvers: { members: [] }
  architecture-reviewers: { members: [] }
  security-reviewers: { members: [] }
  risk-reviewers: { members: [] }
  operations-reviewers: { members: [] }

# Add participating repositories with stable aliases. An empty registry is
# valid until an initiative story plan references a repository. Application
# identity and any organization-specific tags stay with the Git configuration:
# repositories:
#   mobile:
#     url: git@git.example.corp:company/mobile.git
#     defaultBranch: main
#     required: true
#     # For large repositories, fetch historical blobs on demand and materialize only these cones.
#     # Singularity Flow automatically retains singularity/ and .github/agents/ in sparse mode.
#     clone: { mode: blobless-sparse, filter: "blob:none", sparseCone: [apps/mobile, packages/contracts], fallback: refuse }
#     jira: { projectKey: MOB }
#     metadata: { appId: APP-1001, name: Mobile application, owner: Digital }
repositories: {}

repositoryMetadata:
  requiredKeys: []
  patterns:
    appId: "^[A-Z0-9-]{3,32}$"

storage:
  # Where pinned source bytes live. Git always records the immutable provider identifier and the
  # SHA-256 provenance; what differs is who holds the bytes.
  #
  # The default is `local` because jira.enabled is false in this starter file, and a default that
  # points at a disabled provider means a fresh repository cannot pin a single source — which is
  # the one thing intake cannot proceed without. Teams that enable Jira should switch
  # defaultProvider to `jira` so source bytes stay in shared corporate storage rather than in Git.
  defaultProvider: local
  maxBytes: 104857600
  allowedMimeTypes: []
  providers:
    # Bytes committed alongside the Epic, addressed by their own hash. Self-contained and offline,
    # at the cost of the repository carrying them.
    local: { type: local }
    jira: { type: jira-attachment }

initiativeProfiles:
  epic-planning:
    label: Epic planning
    description: Ground an Epic, approve traceable requirements, approve an editable Story/specification package, and publish Jira/Git Stories.
    lifecycleMode: planning-only
    phases: [epic-intake, epic-requirements, epic-planning, epic-publish]
  initiative-lite:
    label: Initiative lite
    description: Four governed phases for smaller cross-repository initiatives.
    lifecycleMode: full-delivery
    phases: [define, plan, build, release]
  enterprise-delivery:
    label: Enterprise delivery
    description: Seven phase gates for complex regulated or multi-team delivery.
    lifecycleMode: full-delivery
    phases: [discover-define, design-iterate, pre-inception, inception, elaboration, construction, delivery]
    # Artifact packs are the deliverables a governance body reviews as one unit. A pack is reviewed at
    # the latest phase that contributes a member, so a pack may span phases: product readiness is the
    # gate plus inception, and release readiness is construction plus delivery. Members that the
    # profile marks optional are hashed but do not hold the pack open.
    packs:
      # A pack may name an ordered review chain instead of a flat authority list. Each step is one
      # governance body, and a step opens only once every earlier step has signed, so the control
      # plane is expressed rather than approximated by a headcount.
      - id: opportunity-investment-brief
        label: Opportunity & Investment Brief
        members:
          - discover-define/opportunity-brief
          - discover-define/business-case
          - discover-define/product-roadmap
        approval:
          mode: bundle
          chain:
            - { authority: product-approvers, label: Product Governance }
            - { authority: executive-approvers, label: Executive Decisioning }
      - id: concept-readiness
        label: Concept Readiness
        members:
          - discover-define/requirements
        approval: { mode: bundle, authorities: [product-approvers], minimum: 1 }
      - id: experience-strategy-concepts
        label: Experience Strategy & Concepts
        members:
          - design-iterate/service-blueprint
          - design-iterate/design-specification
          - design-iterate/solution-validation
        approval: { mode: bundle, authorities: [product-approvers], minimum: 1 }
      - id: product-readiness
        label: Product Readiness
        members:
          - pre-inception/initiative-scope
          - pre-inception/compliance-assessment
          - inception/prfaq
          - inception/intake-record
          - inception/epic-record
          - inception/stakeholder-raci
          - inception/feasibility-report
        approval:
          mode: bundle
          chain:
            - { authority: product-approvers, label: Product Governance }
            - { authority: risk-reviewers, label: LRC Review }
      - id: technical-design-architecture
        label: Technical Design & Architecture
        members:
          - elaboration/solution-architecture
          - elaboration/adr-log
          - elaboration/interface-contracts
          - elaboration/nfr-specification
          - elaboration/data-source-decision
        approval:
          mode: bundle
          chain:
            - { authority: architecture-reviewers, label: Architecture Review }
            - { authority: security-reviewers, label: Security Review }
      - id: implementation-specification
        label: Implementation Specification
        members:
          - elaboration/story-plan
          - elaboration/sequencing-plan
          - elaboration/dependency-matrix
          - elaboration/functional-tests
        approval: { mode: bundle, authorities: [architecture-reviewers], minimum: 1 }
      - id: validation-release-readiness
        label: Validation & Release Readiness
        members:
          - construction/test-attestation
          - construction/cicd-readiness
          - construction/nfr-assessment
          - construction/operational-readiness
          - delivery/deployment-record
          - delivery/production-validation
          - delivery/observability-handoff
          - delivery/initiative-conformance
        approval:
          mode: bundle
          chain:
            - { authority: operations-reviewers, label: Operational Readiness }
            - { authority: security-reviewers, label: Security Review }
            - { authority: initiative-owners, label: Stage Gate Approval }

initiativePhases:
  epic-intake:
    label: Intake
    agents: [product-owner]
    lanes: [business-product]
    worldModelViews: []
    outputs:
      - { id: source-catalog, label: Source catalog, kind: markdown, path: source-catalog.md, generator: source-catalog, required: false }
    checklist:
      - { id: epic-identity-verified, label: Epic identity reserved and verified, requirement: optional, acceptedAssurance: [machine-verified, system-verified], gate: warn }
      - { id: sources-pinned, label: Additional source versions are accessible and hash-pinned, requirement: optional, acceptedAssurance: [machine-verified, system-verified], gate: warn }
    # Intake is a collection step, not an approval ceremony. Jira identity and any pinned
    # source material are enough to continue; repository grounding starts on each Story branch.
    bundleApproval: { mode: none, authorities: [], minimum: 0, allowSelfApproval: true }

  epic-requirements:
    label: Requirements
    agents: [product-owner]
    lanes: [business-product, design-architecture]
    worldModelViews: []
    outputs:
      - { id: requirements-specification, label: Requirements specification, kind: markdown, path: requirements.md, template: initiatives/epic/requirements.md }
      - { id: requirements-traceability, label: Requirements traceability, kind: yaml, path: traceability.yml, template: initiatives/epic/requirements-traceability.yml }
      - { id: impact-analysis, label: Repository impact analysis, kind: yaml, path: impact-analysis.yml, template: initiatives/epic/impact-analysis.yml }
    checklist:
      - { id: requirements-traceable, label: Every REQ and AC cites a pinned source, requirement: must, acceptedAssurance: [machine-verified, human-approved], gate: block }
      - { id: material-questions-resolved, label: Material scope questions are resolved or explicitly accepted, requirement: optional, acceptedAssurance: [human-approved], gate: warn }
      - { id: impact-grounded, label: Impact analysis resolves every named repository against workspace configuration, requirement: must, acceptedAssurance: [machine-verified], gate: block }
    bundleApproval: { mode: bundle, authorities: [product-approvers], minimum: 1, allowSelfApproval: true }

  epic-planning:
    label: Planning
    agents: [architect]
    lanes: [business-product, design-architecture, engineering]
    worldModelViews: []
    outputs:
      - { id: story-plan, label: Executable Story plan, kind: yaml, path: story-plan.yml, template: initiatives/epic/story-plan.yml, consumes: [epic-requirements/requirements-specification, epic-requirements/requirements-traceability, epic-requirements/impact-analysis] }
      - { id: parent-specification, label: Parent solution specification, kind: markdown, path: parent-spec.md, template: initiatives/epic/parent-spec.md, consumes: [epic-requirements/requirements-specification, epic-requirements/requirements-traceability, epic-requirements/impact-analysis] }
      - { id: story-specification-index, label: Story specification index, kind: yaml, path: story-spec-index.yml, template: initiatives/epic/story-spec-index.yml, consumes: [epic-requirements/requirements-specification, epic-requirements/requirements-traceability, epic-requirements/impact-analysis] }
    checklist:
      - { id: stories-traceable, label: Every Story maps to REQ and AC identifiers, requirement: must, acceptedAssurance: [machine-verified, human-approved], gate: block }
      - { id: repositories-resolved, label: Every Story has a configured owning repository, requirement: must, acceptedAssurance: [machine-verified], gate: block }
      - { id: dependencies-acyclic, label: Story dependencies are valid and acyclic, requirement: must, acceptedAssurance: [machine-verified], gate: block }
      - { id: story-specifications-complete, label: Every Story has an exact hash-bound specification, requirement: must, acceptedAssurance: [machine-verified], gate: block }
      - { id: acceptance-criteria-covered, label: Every acceptance criterion is allocated to at least one Story, requirement: must, acceptedAssurance: [machine-verified], gate: block }
    bundleApproval: { mode: bundle, authorities: [product-approvers], minimum: 1, allowSelfApproval: true }

  epic-publish:
    label: Publish Stories
    agents: [product-owner]
    lanes: [business-product, engineering]
    worldModelViews: []
    outputs:
      - { id: jira-write-plan, label: Jira write plan, kind: yaml, path: jira-write-plan.yml, template: initiatives/epic/jira-write-plan.yml, consumes: [epic-planning/story-plan, epic-planning/parent-specification, epic-planning/story-specification-index] }
      - { id: materialization-report, label: Jira and Git materialization report, kind: markdown, path: materialization-report.md, template: initiatives/epic/materialization-report.md, consumes: [epic-planning/story-plan, epic-planning/parent-specification, epic-planning/story-specification-index] }
    checklist:
      - { id: jira-permission-verified, label: Selected identity authority can create Story records, requirement: must, acceptedAssurance: [machine-verified, system-verified], gate: block }
      - { id: stories-materialized, label: Jira Stories and canonical Git branches have receipts, requirement: must, acceptedAssurance: [system-verified, machine-verified], gate: block }
    # The Planning package already carries the Product Owner decision. This operational phase
    # completes automatically only after exact Jira and Git receipts exist for every Story.
    bundleApproval: { mode: none, authorities: [], minimum: 0, allowSelfApproval: true }

  define:
    label: Define
    agents: [product-owner]
    lanes: [business-product]
    worldModelViews: [business]
    outputs:
      - { id: business-case, label: Business case, kind: markdown, path: business-case.md, template: initiatives/generic-output.md, approval: { mode: individual, authorities: [product-approvers], minimum: 1, allowSelfApproval: true } }
      - { id: scope-and-outcomes, label: Scope and outcomes, kind: markdown, path: scope-and-outcomes.md, template: initiatives/generic-output.md }
      - { id: acceptance-criteria, label: Acceptance criteria, kind: markdown, path: acceptance-criteria.md, template: initiatives/generic-output.md }
    checklist:
      - { id: business-case-approved, label: Business case approved, requirement: must, acceptedAssurance: [human-approved], gate: block }
      - { id: scope-agreed, label: Scope and outcomes agreed, requirement: must, acceptedAssurance: [human-approved], gate: block }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  plan:
    label: Plan
    agents: [architect]
    lanes: [business-product, design-architecture, engineering]
    worldModelViews: [business, architecture, security]
    outputs:
      - { id: architecture-summary, label: Architecture summary, kind: markdown, path: architecture-summary.md, template: initiatives/generic-output.md, consumes: [define/scope-and-outcomes], approval: { mode: individual, authorities: [architecture-reviewers], minimum: 1, allowSelfApproval: true } }
      - { id: story-plan, label: Story plan, kind: yaml, path: story-plan.yml, template: initiatives/generic-output.yml, consumes: [define/acceptance-criteria] }
      - { id: interface-contracts, label: Interface contracts, kind: interface-contract, path: interface-contracts.md, template: initiatives/interface-contract.md, consumes: [define/scope-and-outcomes], approval: { mode: individual, authorities: [architecture-reviewers], minimum: 1, allowSelfApproval: true } }
    checklist:
      - { id: stories-ready, label: Repository stories estimated and sequenced, requirement: must, acceptedAssurance: [human-approved, system-verified], gate: block }
      - { id: dependencies-agreed, label: Dependencies and contracts agreed, requirement: must, acceptedAssurance: [human-approved, system-verified], gate: block }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  build:
    label: Build
    agents: [developer]
    lanes: [engineering]
    worldModelViews: [architecture, development, testing, security, operations]
    outputs:
      - { id: implementation-index, label: Implementation evidence index, kind: markdown, path: implementation-index.md, template: initiatives/generic-output.md, consumes: [plan/story-plan, plan/interface-contracts] }
      - { id: test-and-ci-report, label: Test and CI report, kind: markdown, path: test-and-ci-report.md, template: initiatives/generic-output.md, consumes: [plan/story-plan] }
    checklist:
      - { id: blocking-stories-complete, label: All blocking stories complete and conformant, requirement: must, acceptedAssurance: [machine-verified, system-verified], gate: block }
      - { id: tests-passing, label: Required tests and CI checks pass, requirement: must, acceptedAssurance: [machine-verified, system-verified], gate: block }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  release:
    label: Release
    agents: [qa]
    lanes: [business-product, engineering]
    worldModelViews: [release, operations, testing]
    outputs:
      - { id: release-record, label: Release record, kind: markdown, path: release-record.md, template: initiatives/generic-output.md, consumes: [build/implementation-index] }
      - { id: production-validation, label: Production validation, kind: markdown, path: production-validation.md, template: initiatives/generic-output.md, consumes: [build/test-and-ci-report] }
      - { id: initiative-conformance, label: Initiative conformance, kind: markdown, path: initiative-conformance.md, template: initiatives/generic-output.md, consumes: [build/implementation-index, build/test-and-ci-report] }
    checklist:
      - { id: deployment-complete, label: Production deployment completed, requirement: must, acceptedAssurance: [machine-verified, system-verified], gate: block }
      - { id: monitoring-healthy, label: Production monitoring is healthy, requirement: must, acceptedAssurance: [machine-verified, system-verified], freshness: { validFor: 24h, revalidateAt: [release] }, gate: block }
      - { id: business-accepted, label: Business acceptance completed, requirement: must, acceptedAssurance: [human-approved], gate: block }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  discover-define:
    label: Discover & Define
    agents: [product-owner]
    lanes: [business-product]
    worldModelViews: [business]
    # The requirement document is what every Epic must leave behind: the formalized requirement and
    # the impact analysis in one place. The long-form business artifacts are right for some work and
    # ceremony for the rest, so each Epic chooses them (`initiative outputs`, or the Artifacts pane).
    outputs:
      - { id: requirements, label: Requirement and impact analysis, kind: markdown, path: requirements.md, template: initiatives/requirement-impact.md, approval: { mode: individual, authorities: [product-approvers], minimum: 1, allowSelfApproval: true } }
      - { id: business-case, label: Business case, kind: markdown, path: business-case.md, template: initiatives/business-case.md, required: false, approval: { mode: individual, authorities: [product-approvers], minimum: 1, allowSelfApproval: true } }
      - { id: opportunity-brief, label: Market and customer opportunity, kind: markdown, path: opportunity-brief.md, template: initiatives/opportunity-brief.md, required: false }
      - { id: product-roadmap, label: Product roadmap, kind: markdown, path: product-roadmap.md, template: initiatives/product-roadmap.md, required: false }
    checklist:
      - { id: opportunity-defined, label: Opportunity and measurable outcomes defined, requirement: must, acceptedAssurance: [human-approved], gate: block }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  design-iterate:
    label: Design & Iterate
    agents: [product-designer]
    lanes: [business-product, design-architecture]
    worldModelViews: [business, architecture]
    outputs:
      - { id: service-blueprint, label: Service blueprint and journey, kind: markdown, path: service-blueprint.md, template: initiatives/service-blueprint.md, consumes: [discover-define/requirements, discover-define/opportunity-brief] }
      - { id: design-specification, label: Design specification and prototype index, kind: markdown, path: design-specification.md, template: initiatives/design-specification.md, consumes: [discover-define/requirements, discover-define/opportunity-brief] }
      - { id: solution-validation, label: Solution validation report, kind: markdown, path: solution-validation.md, template: initiatives/solution-validation.md, consumes: [discover-define/requirements, discover-define/business-case] }
    checklist:
      - { id: solution-validated, label: Proposed solution validated with representative users and stakeholders, requirement: must, acceptedAssurance: [human-approved, system-verified], gate: block }
    bundleApproval: { mode: bundle, authorities: [product-approvers], minimum: 1, allowSelfApproval: true }

  pre-inception:
    label: Product Gate / Pre-Inception
    agents: [product-owner]
    lanes: [business-product, design-architecture]
    worldModelViews: [business, architecture, security]
    outputs:
      - { id: initiative-scope, label: High-level initiative scope, kind: markdown, path: initiative-scope.md, template: initiatives/initiative-scope.md, consumes: [discover-define/requirements, design-iterate/solution-validation] }
      - { id: compliance-assessment, label: Legal risk and compliance assessment, kind: markdown, path: compliance-assessment.md, template: initiatives/compliance-assessment.md, consumes: [discover-define/requirements, discover-define/business-case], approval: { mode: individual, authorities: [risk-reviewers], minimum: 1, allowSelfApproval: true } }
    checklist:
      - { id: business-case-exists, label: Approved business case exists, requirement: must, acceptedAssurance: [human-approved], gate: block }
      - { id: initiative-created-and-scoped, label: Initiative created and scoped at a high level, requirement: must, acceptedAssurance: [system-verified, human-approved], gate: block }
      - { id: compliance-assessment-complete, label: Legal risk and compliance assessment completed, requirement: must, acceptedAssurance: [human-approved, system-verified], freshness: { validFor: 180d, revalidateAt: [delivery] }, gate: block }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  inception:
    label: Inception
    agents: [product-owner]
    lanes: [business-product, design-architecture, engineering]
    worldModelViews: [business, architecture, testing, security]
    outputs:
      - { id: stakeholder-raci, label: Stakeholder register and RACI, kind: markdown, path: stakeholder-raci.md, template: initiatives/stakeholder-raci.md, consumes: [pre-inception/initiative-scope] }
      - { id: intake-record, label: Accepted intake record, kind: markdown, path: intake-record.md, template: initiatives/intake-record.md, consumes: [pre-inception/initiative-scope] }
      - { id: epic-record, label: Epic and initiative linkage, kind: yaml, path: epic-record.yml, template: initiatives/epic-record.yml, consumes: [pre-inception/initiative-scope] }
      - { id: prfaq, label: PRFAQ, kind: markdown, path: prfaq.md, template: initiatives/prfaq.md, consumes: [pre-inception/initiative-scope], approval: { mode: individual, authorities: [product-approvers], minimum: 1, allowSelfApproval: true } }
      - { id: test-data-inventory, label: Test data entity inventory, kind: markdown, path: test-data-inventory.md, template: initiatives/test-data-inventory.md, consumes: [pre-inception/initiative-scope] }
      - { id: feasibility-report, label: Feasibility report, kind: markdown, path: feasibility-report.md, template: initiatives/feasibility-report.md, consumes: [pre-inception/initiative-scope] }
      - { id: release-scope, label: Release scope and rollout, kind: markdown, path: release-scope.md, template: initiatives/release-scope.md, consumes: [pre-inception/initiative-scope] }
      - { id: ux-concept, label: UX concept design, kind: markdown, path: ux-concept.md, template: initiatives/ux-concept.md, consumes: [design-iterate/design-specification], required: false }
      - { id: poc-results, label: POC summary and results, kind: markdown, path: poc-results.md, template: initiatives/poc-results.md, consumes: [pre-inception/initiative-scope], required: false }
    checklist:
      - { id: stakeholder-map-complete, label: Cross-functional stakeholder map and RACI completed, requirement: must, acceptedAssurance: [human-approved], gate: block }
      - { id: intake-accepted, label: Required product and engineering intake completed, requirement: must, acceptedAssurance: [system-verified, human-approved], gate: block }
      - { id: epic-linked, label: Epic created and linked to the initiative, requirement: must, acceptedAssurance: [system-verified, human-approved], gate: block }
      - { id: prfaq-approved, label: PRFAQ created and approved, requirement: must, acceptedAssurance: [human-approved], gate: block }
      - { id: test-data-entities-identified, label: Test data entities identified, requirement: must, acceptedAssurance: [human-approved], gate: block }
      - { id: feasibility-complete, label: Feasibility analysis completed, requirement: must, acceptedAssurance: [human-approved, machine-verified], gate: block }
      - { id: ux-concept-approved, label: UX concept design completed when applicable, requirement: conditional, applicability: { policy: ux-required }, acceptedAssurance: [human-approved], gate: block }
      - { id: poc-complete, label: POC developed and tested, requirement: optional, acceptedAssurance: [human-approved, machine-verified], gate: warn }
    bundleApproval: { mode: bundle, authorities: [initiative-owners], minimum: 1, allowSelfApproval: true }

  elaboration:
    label: Elaboration
    agents: [architect]
    lanes: [business-product, design-architecture, engineering]
    worldModelViews: [business, architecture, development, testing, security, operations]
    outputs:
      - { id: functional-tests, label: Functional test catalog and acceptance criteria, kind: markdown, path: functional-tests.md, template: initiatives/functional-tests.md, consumes: [inception/prfaq] }
      - { id: nfr-specification, label: Non-functional requirements, kind: markdown, path: nfr-specification.md, template: initiatives/nfr-specification.md, consumes: [inception/feasibility-report] }
      - { id: story-plan, label: Repository story plan, kind: yaml, path: story-plan.yml, template: initiatives/epic/story-plan.yml, consumes: [inception/epic-record, inception/prfaq], approval: { mode: individual, authorities: [product-approvers], minimum: 1, allowSelfApproval: true } }
      - { id: data-source-decision, label: Test data source decision, kind: markdown, path: data-source-decision.md, template: initiatives/data-source-decision.md, consumes: [inception/test-data-inventory] }
      - { id: data-readiness, label: Test data readiness, kind: markdown, path: data-readiness.md, template: initiatives/data-readiness.md, consumes: [inception/test-data-inventory] }
