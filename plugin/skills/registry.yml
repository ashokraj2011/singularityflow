version: 1

# Installation must not take over ordinary Copilot requests, including read-only requests.
# Skills remain explicitly invocable. Selecting the SFlow workflow agent opts into natural-language
# Home routing; /sf-pause disables that guidance locally without changing governed Story state.
automaticInvocationAllowlist: []

classes:
  conversational:
    outputContract: guided-actions
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  echo:
    outputContract: concise-relay
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 8192
    hardMaximumBytes: 65536
  interactive:
    outputContract: explicit-selection
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  guided:
    outputContract: conversational-guidance
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  review:
    outputContract: governed-review
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  generative:
    outputContract: clarification-and-artifact
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  mutation:
    outputContract: deterministic-mutation
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  repair:
    outputContract: scoped-repair
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  advisory:
    outputContract: advisory-analysis
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536
  delegation:
    outputContract: canonical-delegation
    kernelModelPolicy: never
    warningTokens: 500
    maximumTokens: 800
    previewBytes: 16384
    hardMaximumBytes: 65536

# Every public skill is deliberately classified. All classes share the same body
# budget so catalog growth cannot hide behind per-skill exceptions. A skill defaults
# to the active Story boundary. Entry points that can run before Story selection must declare the
# narrowest honest boundary: machine for installed-product and workspace-registry operations,
# repository for one explicitly opened/selected checkout, or organisation for a selected lead
# authority. A broader boundary may narrow through verified CLI output, but may never discover a
# repository by searching a home or parent directory.
skills:
  sflow-pause: { class: mutation, executionBoundary: machine }
  sflow-about: { class: echo, executionBoundary: machine }
  sflow-adhoc: { class: interactive, executionBoundary: repository }
